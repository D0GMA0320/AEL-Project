<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LC 리스닝 트레이너</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#1d2433;--mute:#667085;--line:#e4dfd6;--acc:#0f766e;--accbg:#e1f3f0;--onacc:#fff;--ok:#15803d;--okbg:#e6f4ea;--bad:#b42318;--badbg:#fdeceb;--warn:#92400e;--warnbg:#fdf3e0;--shadow:0 1px 2px rgba(20,30,50,.06),0 4px 14px rgba(20,30,50,.05)}
@media (prefers-color-scheme:dark){:root{--bg:#12161d;--card:#1a2029;--ink:#e8ebf0;--mute:#9aa4b2;--line:#2a3340;--acc:#2dd4bf;--accbg:#12302d;--onacc:#04201d;--ok:#4ade80;--okbg:#12301d;--bad:#f87171;--badbg:#3a1a1a;--warn:#fbbf24;--warnbg:#3a2c10;--shadow:none}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.6 "Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:880px;margin:0 auto;padding:0 16px}
header{padding:20px 0 6px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:22px;letter-spacing:-.02em}
.sub{color:var(--mute);font-size:13px;margin-top:2px}
.pill{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--accbg);color:var(--acc);font-weight:500;white-space:nowrap}
.pill.off{background:var(--warnbg);color:var(--warn)}
nav{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:99px;font-size:14px;font-weight:500}
nav button.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
main{padding:18px 0 60px}
h2{font-size:17px;margin:0 0 4px}
h3{font-size:15px;margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.muted{color:var(--mute);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sp-between{justify-content:space-between}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 13px;font-size:14px}
.chip.on{background:var(--accbg);color:var(--acc);border-color:var(--acc);font-weight:700}
.partgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.part{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px}
.part.on{border-color:var(--acc);background:var(--accbg)}
.part b{display:block;font-size:15px}
.part span{font-size:12.5px;color:var(--mute)}
.lbl{font-size:13px;font-weight:700;margin:14px 0 6px;color:var(--mute)}
.btn{border:0;background:var(--acc);color:var(--onacc);padding:10px 18px;border-radius:10px;font-weight:700}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.big{padding:12px 24px;font-size:16px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.on{background:var(--bad);color:#fff}
.mini{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:1px 8px;font-size:13px;line-height:1.7}
.mini.on{background:var(--accbg);border-color:var(--acc)}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:9px}
.scene{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.player{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px;border-radius:12px;background:var(--accbg);margin-bottom:14px}
.q{border-top:1px dashed var(--line);padding-top:12px;margin-top:12px}
.q:first-of-type{border:0;margin-top:0;padding-top:0}
.qp{font-weight:500;margin-bottom:8px}
.opts{display:grid;gap:8px}
.opts.hid{grid-template-columns:repeat(auto-fit,minmax(84px,1fr))}
.opt{display:flex;gap:10px;align-items:center;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px}
.opt b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:13px}
.opts.hid .opt{justify-content:center;font-size:18px;padding:14px 8px}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ok b{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.bad b{background:var(--bad);color:#fff}
.opt.dim{opacity:.6}
.opt:disabled{cursor:default}
.fb{margin-top:10px;border-radius:10px;padding:10px 12px;font-size:14px}
.fb.ok{background:var(--okbg);color:var(--ok)}
.fb.bad{background:var(--badbg);color:var(--bad)}
.fb p{margin:4px 0 0;color:var(--ink)}
.fb .trap{color:var(--mute);font-size:13px}
.script{background:var(--bg);border-radius:10px;padding:8px 12px;margin-top:12px}
.line{display:flex;gap:10px;align-items:flex-start;padding:5px 6px;border-radius:8px}
.line.now{background:var(--accbg)}
.line .sp{flex:none;min-width:34px;font-size:12px;font-weight:700;color:var(--mute);padding-top:2px}
.line .tx{flex:1}
.line.key .tx{font-weight:700;color:var(--ok)}
.kw{display:inline-block;margin:3px 6px 0 0;padding:3px 10px;border-radius:99px;background:var(--accbg);color:var(--acc);font-size:13px}
.kw small{color:var(--mute);margin-left:4px}
.score{font-size:44px;font-weight:700;color:var(--acc);line-height:1.1}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.ci{padding:8px 0;border-top:1px solid var(--line)}
.ci:first-child{border:0}
.cw{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cw b{font-size:17px}
.ipa{color:var(--mute);font-size:13px;font-family:ui-monospace,Menlo,monospace}
.ck{font-size:14px;margin-top:1px}
.ex{font-size:13.5px;color:var(--mute);margin-top:2px}
.tip{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:13.5px;margin-top:8px}
.tag{font-size:11.5px;padding:2px 8px;border-radius:6px;background:var(--bg);color:var(--mute);margin-right:6px}
.quiz{margin-top:10px;padding:10px;border-radius:10px;background:var(--accbg)}
textarea{width:100%;min-height:90px;border:1.5px solid var(--line);border-radius:10px;padding:10px;background:var(--card);color:var(--ink);font:inherit;resize:vertical}
.w-ok{color:var(--ok);font-weight:700}
.w-miss{color:var(--bad);text-decoration:underline wavy;font-weight:700}
.w-ex{color:var(--warn)}
.busy{text-align:center;padding:40px 10px}
.spin{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--acc);border-radius:50%;margin:0 auto 12px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:20}
#toast.show{opacity:1}
pre.coach{white-space:pre-wrap;font:inherit;margin:8px 0 0}
.stat{display:grid;grid-template-columns:70px 1fr 90px;gap:10px;align-items:center;font-size:14px;margin:6px 0}
footer{color:var(--mute);font-size:12.5px;padding-bottom:30px}
.sr{position:absolute;left:-9999px}
.lk{margin-top:10px;padding:10px 12px;border-radius:10px;border:1px dashed var(--acc);background:var(--accbg);font-size:14px}
.focusbar{border-color:var(--acc);background:var(--accbg);padding:10px 14px}
button:disabled.chip{opacity:.45;cursor:not-allowed}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <div>
        <h1>🎧 LC 리스닝 트레이너</h1>
        <div class="sub">TOEIC LC Part 2–4 · 듣기 → 풀이 → 즉시 피드백 → 오답 연계 학습</div>
      </div>
      <span id="status" class="pill off">음성 확인 중…</span>
    </div>
  </header>
  <nav id="tabs" aria-label="메뉴"></nav>
  <main id="app"></main>
  <footer>음성은 AI 합성 음성(대체로 미국식 발음)입니다. 실제 시험에는 영국·호주·캐나다 등 다른 억양도 나오니, 별도로 접해 보세요. 학습 기록은 이 브라우저에만 저장됩니다.</footer>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ============ 유틸 ============ */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const L='ABCD';
let toastT=null;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600)}
const store={k:'lc-trainer-v1',mem:null,
  load(){if(this.mem)return this.mem;let d=null;try{d=JSON.parse(localStorage.getItem(this.k))}catch(e){}
    const m=this.mem=Object.assign({hist:[],wrong:[],fav:[],extra:[],packs:{},seen:{},done:{},lk:{},settings:{}},d||{});
    if(m.packVer!==3){m.packs={};m.seen={};m.packVer=3}   /* 고난이도 문제로 교체: 이전 쉬운 문제 묶음은 폐기 */
    if(!m.lk||typeof m.lk!=='object')m.lk={};
    ['sent','conf','kw','pairs','topics'].forEach(k=>{if(!Array.isArray(m.lk[k]))m.lk[k]=[]});
    if(!m.settings||typeof m.settings!=='object')m.settings={};
    if(typeof m.settings.linkCorrect!=='boolean')m.settings.linkCorrect=false;
    return m},
  save(){try{localStorage.setItem(this.k,JSON.stringify(this.mem))}catch(e){}}};

/* ============ 내장 데이터 ============ */
const BANK={
2:[
{question:`Haven't the new security badges come in yet?`,
 questions:[{prompt:`질문에 가장 알맞은 응답을 고르세요.`,options:[`Mr. Cho picked up a box from the front desk an hour ago.`,`The security guard is on break.`,`No, the doors are locked at night.`],answer:0,
 explanation:`부정의문문에 "Mr. Cho가 한 시간 전에 프런트에서 상자를 가져갔다"고 답해, 배지가 이미 도착했음을 간접적으로 알려 줍니다. (B)는 security를 반복한 함정이고, (C)는 No로 시작하지만 질문 내용과 무관합니다.`,trap:`간접 응답 / 동어 반복(security)`}],
 keywords:[{en:`come in`,ko:`(물건이) 도착하다`},{en:`pick up`,ko:`수령하다, 찾아오다`}]},
{question:`I thought you were presenting the quarterly figures today.`,
 questions:[{prompt:`질문에 가장 알맞은 응답을 고르세요.`,options:[`Ms. Rivera asked to switch with me.`,`The figures are on page twelve.`,`At three o'clock this afternoon.`],answer:0,
 explanation:`예상과 다르다는 말에 "Ms. Rivera가 순서를 바꿔 달라고 했다"며 이유를 설명한 (A)가 자연스럽습니다. (B)는 figures 반복, (C)는 When 질문에 어울리는 답입니다.`,trap:`간접 응답(이유 설명) / 동어 반복(figures) / 의문사 불일치`}],
 keywords:[{en:`switch with`,ko:`~와 (순서·자리를) 바꾸다`},{en:`quarterly figures`,ko:`분기 수치`}]},
{question:`Would it be possible to get a refund if the warranty has expired?`,
 questions:[{prompt:`질문에 가장 알맞은 응답을 고르세요.`,options:[`That depends on when you bought it.`,`The warranty card is in the drawer.`,`She is expecting a refund by Friday.`],answer:0,
 explanation:`Yes/No로 바로 답하지 않고 "구매 시점에 따라 다르다"고 조건을 제시한 (A)가 정답입니다. (B)는 warranty, (C)는 refund를 반복한 함정이며 (C)는 주어도 맞지 않습니다.`,trap:`우회 응답 / 동어 반복(warranty, refund)`}],
 keywords:[{en:`depend on`,ko:`~에 달려 있다`},{en:`warranty`,ko:`품질 보증(서)`}]},
{question:`Which of the candidates did you interview first?`,
 questions:[{prompt:`질문에 가장 알맞은 응답을 고르세요.`,options:[`The one who used to work at Delta Logistics.`,`For about forty minutes each.`,`Yes, I interviewed her twice.`],answer:0,
 explanation:`Which 질문에 특징으로 후보를 지칭한 (A)가 정답입니다. (B)는 How long, (C)는 Yes/No로 Which 질문에 쓸 수 없고 interview를 반복했습니다.`,trap:`의문사 불일치 / 동어 반복(interview)`}],
 keywords:[{en:`used to ~`,ko:`예전에 ~했다`},{en:`candidate`,ko:`지원자`}]},
{question:`You're coming to the retirement party, aren't you?`,
 questions:[{prompt:`질문에 가장 알맞은 응답을 고르세요.`,options:[`I have a client dinner that evening.`,`Yes, Mr. Han is retiring in June.`,`The party was at the Grand Hotel last year.`],answer:0,
 explanation:`참석 여부를 묻는 부가의문문에 "그날 저녁 고객 만찬이 있다"고 답해 간접적으로 거절했습니다. (B)는 Yes로 시작하지만 참석 여부와 무관하게 retire를 반복했고, (C)는 party를 반복한 과거 이야기입니다.`,trap:`간접 거절 / 동어 반복(retire, party)`}],
 keywords:[{en:`retirement party`,ko:`은퇴 기념 파티`},{en:`client dinner`,ko:`고객 만찬`}]},
{question:`Let's reserve a larger conference room, since more people signed up.`,
 questions:[{prompt:`질문에 가장 알맞은 응답을 고르세요.`,options:[`The only one available is on the sixth floor.`,`I signed the contract this morning.`,`Please sign up by Friday.`],answer:0,
 explanation:`제안 문장에 "쓸 수 있는 곳은 6층뿐"이라는 정보를 덧붙여 반응한 (A)가 정답입니다. (B)와 (C)는 sign이 들어간 유사 발음·반복 함정입니다.`,trap:`평서문에 대한 반응 / 유사 발음·반복(sign)`}],
 keywords:[{en:`sign up`,ko:`등록하다, 신청하다`},{en:`available`,ko:`이용 가능한`}]},
{question:`Why hasn't the shipment arrived at the warehouse?`,
 questions:[{prompt:`질문에 가장 알맞은 응답을 고르세요.`,options:[`The carrier changed its delivery route.`,`It's near the warehouse district.`,`Yes, I shipped it on Monday.`],answer:0,
 explanation:`Why 질문에는 이유로 답해야 합니다. (B)는 위치(Where), (C)는 Yes/No이며 shipment와 shipped가 비슷해 유인하는 함정입니다.`,trap:`의문사 불일치 / 유사 발음(shipment↔shipped)`}],
 keywords:[{en:`carrier`,ko:`운송업체`},{en:`delivery route`,ko:`배송 경로`}]},
{question:`Do you want me to proofread the proposal, or would you rather finish it yourself?`,
 questions:[{prompt:`질문에 가장 알맞은 응답을 고르세요.`,options:[`I'd appreciate a second pair of eyes.`,`Yes, it was proofread by Dr. Kim.`,`The proposal is due at noon.`],answer:0,
 explanation:`"다른 사람의 눈이 필요하다(a second pair of eyes)"는 관용 표현으로 교정을 부탁한 (A)가 정답입니다. 선택 의문문에 Yes로 답한 (B)와 proposal을 반복한 (C)는 오답입니다.`,trap:`관용 표현 / 선택 의문문에 Yes / 동어 반복`}],
 keywords:[{en:`proofread`,ko:`교정하다`},{en:`a second pair of eyes`,ko:`다른 사람의 점검`}]}
],
3:[
{audio:[
 {s:'W',text:`Before we finalize the catering for Friday's client event, I should mention that Ms. Alvarez's group has grown to about sixty.`},
 {s:'M',text:`That's more than the terrace can hold. The limit is fifty. We could move everything indoors, but the ballroom is booked for a wedding.`},
 {s:'W',text:`What about the rooftop lounge? It seats seventy.`},
 {s:'X',text:`The lounge is available, but the elevator is under repair until Thursday, and the stairs are quite steep. Some of the older guests might have trouble.`},
 {s:'M',text:`Then I'd keep the terrace and cap the head count at fifty. Ms. Alvarez can decide who attends.`},
 {s:'W',text:`She won't like that. Let me call her and ask whether she'd consider a second, smaller session on Saturday morning instead.`},
 {s:'X',text:`Good idea. I'll check whether the terrace is free then, and I'll text you before noon.`}],
 questions:[
 {prompt:`What does the woman say about Ms. Alvarez's group?`,options:[`It has grown larger than planned.`,`It has canceled its reservation.`,`It will arrive late on Friday.`,`It prefers an indoor event.`],answer:0,explanation:`첫 대사의 "has grown to about sixty"가 "계획보다 커졌다"로 바뀐 패러프레이징입니다.`,trap:`패러프레이징(grown→larger than planned)`},
 {prompt:`Why is the second man concerned about the rooftop lounge?`,options:[`Some guests may find it hard to reach.`,`It cannot seat enough people.`,`It costs more than the terrace.`,`It is reserved for a wedding.`],answer:0,explanation:`엘리베이터가 수리 중이고 계단이 가파르다고 했으므로 일부 손님이 올라가기 어렵다는 뜻입니다. wedding은 연회장(ballroom)에 대한 정보라 함정입니다.`,trap:`다른 장소 정보를 섞은 함정(wedding)`},
 {prompt:`What does the second man say he will do?`,options:[`Check whether an outdoor space is free.`,`Call the client directly.`,`Arrange a repair for the elevator.`,`Book the ballroom for Saturday.`],answer:0,explanation:`마지막 대사 "I'll check whether the terrace is free then"에서 terrace가 outdoor space로 바뀌었습니다. 고객에게 전화하는 사람은 여자입니다.`,trap:`화자별 할 일 혼동 / 패러프레이징(terrace→outdoor space)`}],
 keywords:[{en:`head count`,ko:`인원수`},{en:`cap at ~`,ko:`~로 상한을 두다`},{en:`under repair`,ko:`수리 중인`}]},
{audio:[

 {s:'W',text:`Really? That's a big difference. Our construction crew starts on the fifteenth.`},

function browserVoice(s){
  try{const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));if(!vs.length)return null;
    const male=/david|mark|daniel|alex|fred|george|james|guy|\bmale\b/i,female=/zira|samantha|karen|susan|victoria|serena|moira|hazel|aria|jenny|female/i;
    let c=null;if(s==='M')c=vs.find(v=>male.test(v.name)&&!/female/i.test(v.name));if(s==='W')c=vs.find(v=>female.test(v.name));
    return c||vs.find(v=>/en-US/i.test(v.lang))||vs[0]}catch(e){return null}}
function speakLine(l){
  if(CAP.tts)return CAP.tts.speak(l.text,{voice:VOICE[l.s]||VOICE.N,rate:RATE,language:'en'});
  if(CAP.audio==='browser')return new Promise((res,rej)=>{
    const u=new SpeechSynthesisUtterance(l.text);u.lang='en-US';u.rate=RATE;u.pitch=l.s==='M'?0.85:l.s==='W'?1.15:l.s==='X'?0.95:1;
    const v=browserVoice(l.s);if(v)u.voice=v;u.onend=()=>res();u.onerror=e=>rej({code:e.error||'error'});
    speechSynthesis.speak(u)});
  return Promise.reject({code:'none'});
}

function reportErr(e,my){if(my!==A.tok)return;const c=e&&e.code;if(!c||STOPCODES.has(c))return;
  if(c==='rate_limited')toast('잠시 후 다시 시도해 주세요');else if(c==='busy')toast('말하기 인식 중에는 재생할 수 없어요');else toast('재생 오류: '+c)}
async function playSeq(lines,o,my){
  let ok=true;
  for(let i=0;i<lines.length;i++){
    if(my!==A.tok){ok=false;break}
    if(o.onLine)o.onLine(i);
    try{await speakLine(lines[i])}catch(e){ok=false;reportErr(e,my);break}
    if(my!==A.tok){ok=false;break}
    if(i<lines.length-1&&o.gap)await sleep(o.gap);
  }
  return ok;
}

async function playLines(lines,o={}){
  if(CAP.audio==='none'){toast('이 환경에서는 음성을 재생할 수 없어요. 스크립트로 학습하세요.');return false}
  if(CAP.dict&&S.dict.listening){try{await CAP.dict.stop()}catch(e){}}
  stopAudio();const my=++A.tok;setPlaying(true);A.onLine=o.onLine||null;let ok=true;
  if(CAP.tts&&o.batch&&lines.length>1){
    try{await CAP.tts.speak(lines.map((l,i)=>({text:l.text,voice:VOICE[l.s]||VOICE.N,rate:RATE,language:'en',id:'l'+i})))}
    catch(e){
      if(my!==A.tok)ok=false;
      else if(e&&(e.code==='busy'||e.code==='rate_limited'||STOPCODES.has(e.code))){ok=false;reportErr(e,my)}
      else ok=await playSeq(lines,o,my);
    }
  }else ok=await playSeq(lines,o,my);
  if(my===A.tok){setPlaying(false);clearNow()}
  return ok;
}

function parseJson(t){t=String(t).replace(/```json|```/g,'');const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a<0||b<a)throw new Error('JSON 없음');return JSON.parse(t.slice(a,b+1))}
async function ask(prompt,onText){

let GEN_LABEL='';
/* 난이도는 LC 후반부 수준(고난이도)으로 고정 */
async function genItems(part,n,avoid){
  const spec={
   2:`Part 2 (question-response), modeled on the HARDEST questions of the real TOEIC Part 2 (Q25-31 range). Each item has "question" (the spoken English line, natural with contractions) and "questions": exactly ONE entry with prompt "질문에 가장 알맞은 응답을 고르세요." and exactly 3 English responses in "options". Mix these hard types: negative questions (Haven't they...?), tag questions, statements that need a reaction or suggestion, indirect answers that never repeat the question's keywords (e.g. "That depends on...", "You should ask Dana", "I haven't heard back yet"), rhetorical questions, "Would you rather..." choices answered idiomatically, and indirect refusals. The correct answer must NOT be a bare Yes/No echo. Distractors: similar-sounding words, repeated keywords, answers to a different question word, Yes/No that does not fit, wrong tense or subject.`,
   3:`Part 3 (conversation), modeled on the HARDEST sets of the real TOEIC Part 3 (Q62-70 range). Each item has "audio": 8-12 turns, 120-180 words total, as [{"s":"W","text":"..."},{"s":"M","text":"..."}]; use s "M" and "W", and for a THIRD speaker use s "X" in about half of the items. Include a change of plan or a correction (a first option is rejected, a number/date/time is revised), several competing details, and distractor words reused from the dialogue. "questions": exactly 3: one detail or problem question, one inference or implied-meaning question such as: What does the man imply when he says, "..."? (quote a line from the dialogue), and one next-action question. Each question has an English "prompt" and exactly 4 English options written as paraphrases of the script, not copies.`,
   4:`Part 4 (talk), modeled on the HARDEST sets of the real TOEIC Part 4 (Q85-100 range). Each item has "audio": 3-5 paragraphs, all with the same speaker s ("M" or "W"), 150-210 words total: an announcement, voicemail, meeting excerpt, tour, ad or broadcast with a reversal or exception ("originally... however..."), numbers/times/prices that change, and conditions. "questions": exactly 3: one detail question requiring paraphrase matching, one speaker-intent question such as: What does the speaker mean when she says, "..."? (quote a line from the talk), and one inference or next-step question. Each question has an English "prompt" and exactly 4 English options paraphrased from the script, with distractors that reuse script words.`
  }[part];
  const av=(avoid&&avoid.length)?`\nDo NOT reuse these earlier scenarios or openers; write clearly different ones: ${avoid.join(' / ')}.`:'';
  const p=`You are an expert TOEIC Listening item writer. Create ${n} new ${part===2?'items':'item sets'} for ${spec}\nDifficulty: HARD (top-score level, like the last questions of each part).\nTopics to draw from (vary them): ${shuffle(TOPICS).slice(0,4).join(', ')}.${av}\nFor every question include: "answer" (0-based index of the correct option, vary it), "explanation" (Korean, 1-3 sentences saying why the answer is right, quoting the key English evidence from the script in double quotes, and why the distractors are wrong), "trap" (short Korean label for the main distractor type). Also include "keywords": 2-4 objects {"en":"useful expression from the script","ko":"Korean meaning"}.\nReturn ONLY one JSON object, no markdown: {"items":[{...}]}`;
  const text=await ask(p,({text})=>{const el=$('#genlog');if(el)el.textContent=GEN_LABEL+'생성 중… '+text.length+'자'});
  const d=parseJson(text);return Array.isArray(d.items)?d.items.slice(0,n):[];
}
const openerOf=(r,p)=>String((p===2?(r&&r.question):(r&&r.audio&&r.audio[0]&&r.audio[0].text))||'').slice(0,70);
function avoidList(p){const d=store.load();return((d.seen&&d.seen[p])||[]).slice(-14)}
function rememberSeen(p,raws){const d=store.load();if(!d.seen)d.seen={};d.seen[p]=((d.seen[p]||[]).concat(raws.map(r=>openerOf(r,p)).filter(Boolean))).slice(-24);store.save()}
/* 한 라운드(새 스크립트 묶음): Part 2는 10문제, Part 3·4는 4세트 */
async function genPack(p){
  const total=p===2?10:4,chunk=p===2?5:2,jobs=Math.ceil(total/chunk);let raws=[];
  for(let j=0;j<jobs;j++){
    GEN_LABEL=`(${j+1}/${jobs}) `;
    try{const got=await genItems(p,Math.min(chunk,total-raws.length),avoidList(p).concat(raws.map(r=>openerOf(r,p))));raws=raws.concat(got.filter(r=>normItem(r,p)))}catch(e){}
  }
  GEN_LABEL='';if(raws.length)rememberSeen(p,raws);return raws;
}
function normItem(r,part){
  if(!r||typeof r!=='object')return null;
  const need=part===2?3:4;
  const qs=(Array.isArray(r.questions)?r.questions:[]).slice(0,part===2?1:3).map(q=>{
    if(!q||!Array.isArray(q.options)||q.options.length<need)return null;
    const opts=q.options.slice(0,need).map(String);let ans=Number.isInteger(q.answer)?q.answer:0;if(ans<0||ans>=opts.length)ans=0;
    return{prompt:String(q.prompt||(part===2?'질문에 가장 알맞은 응답을 고르세요.':'')),
      opts:shuffle(opts.map((t,i)=>({t,ok:i===ans}))),hidden:part===2,pick:null,link:null,exp:String(q.explanation||''),trap:String(q.trap||'')}
  }).filter(Boolean);
  if(!qs.length)return null;
  let audio=[];
  if(part===2){if(!r.question)return null;const s=Math.random()<.5?'M':'W';audio=[{s,text:String(r.question)}].concat(qs[0].opts.map(o=>({s:s==='M'?'W':'M',text:o.t})))}
  else{if(!Array.isArray(r.audio)||r.audio.length<2)return null;audio=r.audio.map(l=>({s:(l&&(l.s==='M'||l.s==='W'||l.s==='X'))?l.s:'N',text:String((l&&l.text)||'')})).filter(l=>l.text&&l.text.length<=1800);if(audio.length<2)return null}
  return{part,audio,qs,show:false,
    kw:(Array.isArray(r.keywords)?r.keywords:[]).slice(0,5).map(k=>({en:String(k&&k.en||''),ko:String(k&&k.ko||'')})).filter(k=>k.en)}
}

function lev(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i].concat(new Array(n).fill(0)));for(let j=0;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
const INFL=new Set(['s','es','ed','d','ing','er','ers','ly','ion','ment']);
function alike(a,b){
  if(a===b)return false;const s=a.length<=b.length?a:b,l=a.length<=b.length?b:a;
  if(s.length>=4&&l.startsWith(s)){const rest=l.slice(s.length);if(INFL.has(rest))return false;return rest.length<=5}
  const d=lev(a,b);return (s.length>=5&&d<=1)||(s.length>=8&&d<=2);

const reEsc=w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const hasWord=(t,w)=>new RegExp("(^|[^a-z'])"+reEsc(String(w).toLowerCase())+"([^a-z']|$)").test(' '+String(t).toLowerCase().replace(/[’]/g,"'")+' ');
const CONF_SKIP=new Set(['to','too','two','can','man','men','take','bring','work','right']);
function matchConf(text,max=4){
  const hits=[];
  allConf().forEach(c=>{let sc=0;c.items.forEach(it=>{String(it.w).split('→').forEach(part=>{const w=part.trim().toLowerCase();if(!w||CONF_SKIP.has(w))return;if(hasWord(text,w))sc++})});if(sc)hits.push({id:c.id,sc})});
  return hits.sort((a,b)=>b.sc-a.sc).slice(0,max).map(h=>h.id);
}
function matchPron(text){
  const topics=[],pairs=[];
  PRON.forEach((p,i)=>{if(p.w.some(w=>hasWord(text,w)))topics.push(i)});
  PAIRS.forEach(pr=>{if(pr.some(w=>hasWord(text,w)))pairs.push(pr)});
  return{topics:topics.slice(0,3),pairs:pairs.slice(0,4)};
}
function clueSentences(it,q){
  const correct=q.opts.find(o=>o.ok).t;
  if(it.part===2)return [it.audio[0].text,correct];
  const pool=[];it.audio.forEach(l=>(l.text.match(/[^.!?]+[.!?]*/g)||[l.text]).forEach(s=>{s=s.trim();if(s.length>12)pool.push(s)}));
  const quotes=((q.exp||'').match(/["“]([A-Za-z][^"”]{4,})["”]/g)||[]).map(x=>x.slice(1,-1).toLowerCase().replace(/[.,!?;]+$/,''));
  const keys=new Set(lwords(correct+' '+q.prompt));
  const scored=pool.map((s,i)=>{const low=s.toLowerCase();let sc=lwords(s).filter(w=>keys.has(w)).length;quotes.forEach(x=>{if(low.includes(x))sc+=5});return{s,i,sc}}).sort((a,b)=>b.sc-a.sc||a.i-b.i);
  const top=scored.filter(x=>x.sc>0).slice(0,2).sort((a,b)=>a.i-b.i).map(x=>x.s);
  return top.length?top:pool.slice(0,1);
}
function linkFor(it,q){
  const script=it.audio.map(l=>l.text).join(' '),all=script+' '+q.opts.map(o=>o.t).join(' ');
  const ref=it.part===2?lwords(it.audio[0].text):[...new Set(it.audio.flatMap(l=>lwords(l.text)))];
  const bad=q.opts.map((o,i)=>({o,i})).filter(x=>!x.o.ok).sort((a,b)=>(b.i===q.pick)-(a.i===q.pick));
  const pairs=[];
  bad.forEach(({o})=>lwords(o.t).forEach(ow=>ref.forEach(rw=>{if(pairs.length<3&&alike(rw,ow)&&!pairs.some(p=>p[0]===rw&&p[1]===ow))pairs.push([rw,ow])})));
  return{sent:clueSentences(it,q),conf:matchConf(all,3),kw:it.kw.map(k=>({en:k.en,ko:k.ko})),pairs,topics:matchPron(all).topics};
}
function commitLinks(b,tag){
  const lk=store.load().lk;
  b.sent.forEach(t=>{if(!lk.sent.some(x=>x.t===t))lk.sent.push({t,tag,ts:Date.now()})});
  b.conf.forEach(id=>{if(!lk.conf.includes(id))lk.conf.push(id)});
  b.kw.forEach(k=>{if(!lk.kw.some(x=>x.en===k.en))lk.kw.push(k)});
  b.pairs.forEach(p=>{if(!lk.pairs.some(x=>x[0]===p[0]&&x[1]===p[1]))lk.pairs.push(p)});
  b.topics.forEach(t=>{if(!lk.topics.includes(t))lk.topics.push(t)});
  lk.sent=lk.sent.slice(-40);lk.conf=lk.conf.slice(-40);lk.kw=lk.kw.slice(-40);lk.pairs=lk.pairs.slice(-30);lk.topics=lk.topics.slice(-8);

}
function mergeLinks(list){
  const f={sent:[],conf:[],kw:[],pairs:[],topics:[]};
  list.filter(Boolean).forEach(l=>{
    (l.sent||[]).forEach(s=>{if(!f.sent.includes(s))f.sent.push(s)});
    (l.conf||[]).forEach(c=>{if(!f.conf.includes(c))f.conf.push(c)});
    (l.kw||[]).forEach(k=>{if(!f.kw.some(x=>x.en===k.en))f.kw.push(k)});
    (l.pairs||[]).forEach(p=>{if(!f.pairs.some(x=>x[0]===p[0]&&x[1]===p[1]))f.pairs.push(p)});
    (l.topics||[]).forEach(t=>{if(!f.topics.includes(t))f.topics.push(t)});
  });

}

    const text=await ask(`You help a Korean learner of TOEIC listening. For the missed questions below, produce targeted follow-up material. Return ONLY JSON: {"sentences":[{"t":"sentence","tag":"짧은 한국어 태그"}] (4-6 dictation sentences of 8-18 words that reuse the sounds, linking/reduction patterns or paraphrase traps the learner missed), "pairs":[["word","word"]] (up to 4 pairs of similar-sounding single English words involved in the traps), "cards":[{"items":[{"w":"word or phrase","ipa":"IPA or empty","ko":"Korean meaning","ex":"short example sentence"}],"tip":"Korean tip on telling them apart by ear"}] (up to 3 cards with 2-3 items each)}.\n\n${list.join('\n')}`);

const wordsOf=t=>t.split(/\s+/).map(w=>({raw:w,k:w.toLowerCase().replace(/[’]/g,"'").replace(/[^a-z0-9']/g,'')})).filter(x=>x.k);
function lcsDiff(target,said){
  const a=wordsOf(target),b=wordsOf(said).map(x=>x.k),n=a.length,m=b.length;
  const dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=a[i].k===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  let i=0,j=0;const extra=[];a.forEach(x=>x.ok=false);
  while(i<n&&j<m){if(a[i].k===b[j]){a[i].ok=true;i++;j++}else if(dp[i+1][j]>=dp[i][j+1])i++;else{extra.push(b[j]);j++}}
  while(j<m){extra.push(b[j]);j++}
  return{words:a,extra,acc:n?a.filter(x=>x.ok).length/n:0};
}

const allConf=()=>CONF.concat(store.load().extra||[]);
/* 헷갈리는 표현 카드 ↔ 발음 주제 연결표 */
const PRON_OF={s1:[3],s2:[0],s4:[1],s5:[2],s6:[4],s8:[3],s9:[6],r1:[6],r2:[6],r3:[7],r4:[7],r5:[7],r6:[7]};
const CONF_OF={};Object.entries(PRON_OF).forEach(([id,ts])=>ts.forEach(t=>{(CONF_OF[t]=CONF_OF[t]||[]).push(id)}));
function findConf(id){return allConf().find(c=>c.id===id)}
function linkedConf(){
  const ids=S.focus?S.focus.conf:store.load().lk.conf,seen=new Set(),out=[];
  ids.forEach(id=>{const c=findConf(id);if(c&&!seen.has(id)){seen.add(id);out.push(c)}});
  if(!S.focus)(store.load().extra||[]).filter(c=>c.cat==='link'&&!seen.has(c.id)).forEach(c=>out.push(c));
  return out;
}
const linkedKw=()=>S.focus?S.focus.kw:store.load().lk.kw;
function cardPron(c){
  const ws=c.items.map(i=>i.w).filter(w=>/^[a-z']+$/i.test(w)),pairs=[];
  if((c.cat==='sound'||c.cat==='num')&&c.items.length>=2&&c.items[0].ipa!==c.items[1].ipa)for(let i=0;i<ws.length;i++)for(let j=i+1;j<ws.length;j++)pairs.push([ws[i].toLowerCase(),ws[j].toLowerCase()]);
  return{pairs:pairs.slice(0,3),topics:PRON_OF[c.id]||[]};
}
function cardHtml(c){
  const fav=store.load().fav.includes(c.id),q=S.conf.quiz&&S.conf.quiz.id===c.id?S.conf.quiz:null,cp=cardPron(c);
  const items=c.items.map((it,k)=>`<div class="ci"><div class="cw"><b>${esc(it.w)}</b>${it.ipa?`<span class="ipa">${esc(it.ipa)}</span>`:''}<button class="mini" data-act="csay" data-id="${esc(c.id)}" data-k="${k}" data-what="w" title="듣기">🔊</button></div><div class="ck">${esc(it.ko)}</div>${it.ex?`<div class="ex"><button class="mini" data-act="csay" data-id="${esc(c.id)}" data-k="${k}" data-what="ex">🔊</button> ${esc(it.ex)}</div>`:''}</div>`).join('');
  let qz='';
  if(q){qz=`<div class="quiz"><div style="margin-bottom:6px"><b>🎧 방금 들은 문장에 쓰인 표현은?</b> <button class="mini" data-act="csay" data-id="${esc(c.id)}" data-k="${q.idx}" data-what="ex">다시 듣기</button></div><div class="row">${c.items.map((it,k)=>`<button class="chip ${q.pick!=null?(k===q.idx?'on':''):''}" ${q.pick!=null?'disabled':''} data-act="cpick" data-k="${k}">${esc(it.w)}</button>`).join('')}</div>${q.pick!=null?`<div class="fb ${q.pick===q.idx?'ok':'bad'}"><b>${q.pick===q.idx?'✔ 정답':'✘ 오답'}</b> <p>${esc(c.items[q.idx].w)} · ${esc(c.items[q.idx].ko)}<br>${esc(c.items[q.idx].ex)}</p></div>`:''}</div>`}
  const hasEx=c.items.some(i=>i.ex);
  return `<div class="card"><div class="row sp-between"><span class="tag">${esc(CATS[c.cat]||'AI 추가')}</span><button class="mini ${fav?'on':''}" data-act="cfav" data-id="${esc(c.id)}">${fav?'★ 저장됨':'☆ 저장'}</button></div>${items}${c.tip?`<div class="tip">💡 ${esc(c.tip)}</div>`:''}
  <div class="row" style="margin-top:8px">${c.noquiz?'':`<button class="btn sec" data-act="cquiz" data-id="${esc(c.id)}">🎧 듣고 맞히기</button>`}${hasEx?`<button class="mini" data-act="cdict" data-id="${esc(c.id)}">✍️ 받아쓰기</button>`:''}${(cp.pairs.length||cp.topics.length)?`<button class="mini" data-act="cpron" data-id="${esc(c.id)}">🗣 발음</button>`:''}</div>${qz}</div>`;
}
function confView(){
  const k=S.conf.cat,isLink=k==='link',nLink=linkedConf().length+linkedKw().length;
  const list=isLink?linkedConf():allConf().filter(c=>k==='all'||c.cat===k);

  const empty=isLink&&!list.length&&!linkedKw().length?`<div class="card muted">아직 연계된 표현이 없어요. 모의고사에서 문제를 풀면 틀린 문제와 관련된 표현이 여기에 모입니다.</div>`:'';

}

ACT.lkcum=(d)=>{S.focus=null;S.dict.src='link';S.conf.cat='link';S.pron.src='link';S.dict.i=0;S.dict.text='';S.dict.res=null;setTab(d.to)};
ACT.lkclear=()=>{const s=store.load();s.lk={sent:[],conf:[],kw:[],pairs:[],topics:[]};s.extra=(s.extra||[]).filter(c=>c.cat!=='link');store.save();S.focus=null;S.dict.src='all';S.conf.cat='all';S.pron.src='all';toast('연계 학습 목록을 비웠어요');render()};
ACT.wipe=()=>{if(!S.log.confirm){S.log.confirm=true;render();return}const s=store.load();s.hist=[];s.wrong=[];s.fav=[];s.extra=[];s.lk={sent:[],conf:[],kw:[],pairs:[],topics:[]};store.save();S.focus=null;S.dict.src='all';S.conf.cat='all';S.pron.src='all';S.log.confirm=false;toast('기록을 초기화했습니다');render()};

/* ============ 공통 렌더 ============ */
const TABS=[['practice','🎧 모의고사'],['dict','✍️ 받아쓰기·쉐도잉'],['conf','🔀 헷갈리는 표현'],['pron','🗣 발음'],['log','📒 학습기록']];
function renderTabs(){$('#tabs').innerHTML=TABS.map(([k,l])=>`<button class="${S.tab===k?'on':''}" data-act="tab" data-t="${k}">${l}</button>`).join('')}
function setTab(t){if(S.tab!==t)stopAudio();S.tab=t;S.log.confirm=false;render();window.scrollTo({top:0})}
function render(){
  renderTabs();
  const v={practice:practiceView,dict:dictView,conf:confView,pron:pronView,log:logView}[S.tab];
  $('#app').innerHTML=v();
  setPlaying(A.playing);
}
function renderStatus(){
  const el=$('#status');
  if(CAP.audio==='claude'){el.textContent='🔊 Claude 음성 사용 중';el.className='pill'}
  else if(CAP.audio==='browser'){el.textContent='🔊 브라우저 음성 사용 중';el.className='pill'}
  else{el.textContent='🔇 음성 미지원 · 스크립트 학습';el.className='pill off'}
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t||t.disabled)return;
  const f=ACT[t.dataset.act];if(f)f(t.dataset,t,e);
});
window.addEventListener('hashchange',()=>{
  if(S.tab!=='practice'||S.busy)return;
  let v=({'#home':'home','#setup':'part','#training':'session'})[location.hash]||'home';
  if(v==='session'&&!S.sess)v='home';
  if(v==='part'&&!PART_IDS.includes(S.cfg.part))v='home';
  if(v!==S.view){if(v==='home'&&S.sess&&S.sess.done){S.sess=null;S.coach=''}if(v!=='session')stopAudio();S.view=v;render()}
});
document.addEventListener('input',e=>{if(e.target&&e.target.id==='dtxt')S.dict.text=e.target.value});

async function initCaps(){
  if(typeof claude!=='undefined'&&claude&&claude.use){
    try{CAP.tts=await claude.use('tts')}catch(e){CAP.tts=null}
    try{if(CAP.tts&&CAP.tts.onLine)CAP.tts.onLine(({line,id})=>{let i=-1;if(typeof id==='string'&&/^l\d+$/.test(id))i=+id.slice(1);else if(typeof line==='number')i=line;if(i>=0&&A.onLine)A.onLine(i)})}catch(e){}
    try{CAP.sample=await claude.use('sample')}catch(e){CAP.sample=null}
    try{CAP.dict=await claude.use('dictation')}catch(e){CAP.dict=null}
  }
  CAP.audio=CAP.tts?'claude':(('speechSynthesis' in window)?'browser':'none');
  if(CAP.dict){
    try{
      CAP.dict.onPartial(({text})=>{const el=$('#heard');if(el)el.textContent=((S.dict.heard+' '+(text||'')).trim())});
      CAP.dict.onFinal(({text})=>{S.dict.heard=(S.dict.heard+' '+(text||'')).trim();const el=$('#heard');if(el)el.textContent=S.dict.heard});
      CAP.dict.onState(({state})=>{const was=S.dict.listening;S.dict.listening=state==='listening';
        if(was&&!S.dict.listening&&S.dict.heard)S.dict.res=lcsDiff(S.dict.pool[S.dict.i].t,S.dict.heard);
        if(S.tab==='dict')render()});
    }catch(e){}
  }
  CAP.ready=true;renderStatus();
  if(!S.busy)render();
}
render();renderStatus();initCaps();
</script>
</body>
